<title>カード画像検索</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1a1d21; --sub:#6b7280;
    --accent:#4f6ef7; --border:#e5e7eb; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101215; --card:#1b1e23; --text:#f0f2f5; --sub:#9aa2ad;
      --accent:#7b93ff; --border:#2a2e35; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);}
  header{position:sticky; top:0; z-index:10; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom:1px solid var(--border);}
  h1{font-size:16px; margin:0 0 8px; font-weight:700; display:flex; align-items:baseline; gap:8px;}
  h1 small{font-weight:400; color:var(--sub); font-size:12px;}
  .searchwrap{position:relative;}
  .searchwrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--sub);}
  #q{width:100%; font-size:16px; padding:11px 40px 11px 38px; border-radius:12px;
    border:1px solid var(--border); background:var(--card); color:var(--text); outline:none; box-shadow:var(--shadow);}
  #q:focus{border-color:var(--accent);}
  #clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:var(--sub);
    color:var(--bg); width:22px; height:22px; border-radius:50%; font-size:13px; line-height:1; cursor:pointer; display:none;}
  #count{font-size:12px; color:var(--sub); margin-top:6px;}
  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:12px 14px 40px;}
  @media (max-width:420px){ #grid{grid-template-columns:repeat(2,1fr);} }
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column;}
  .card:active{transform:scale(.97);}
  .imgwrap{aspect-ratio:3/4; background:linear-gradient(135deg,rgba(127,127,127,.08),rgba(127,127,127,.16));
    display:flex; align-items:center; justify-content:center;}
  .imgwrap img{width:100%; height:100%; object-fit:contain;}
  .meta{padding:8px 9px 9px;}
  .meta .name{font-size:12.5px; font-weight:600; line-height:1.35; word-break:break-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .meta .id{font-size:11px; color:var(--sub); margin-top:3px;}
  #empty{display:none; text-align:center; color:var(--sub); padding:60px 20px; font-size:14px;}
  #more{display:none; margin:0 auto 40px; padding:10px 26px; font-size:14px; border-radius:99px;
    border:1px solid var(--border); background:var(--card); color:var(--accent); font-weight:600; cursor:pointer; box-shadow:var(--shadow);}
  /* modal */
  #modal{display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.82);
    flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  #modal.open{display:flex;}
  #modal img{max-width:100%; max-height:72vh; border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,.5);}
  #mname{color:#fff; font-size:15px; font-weight:700; margin-top:14px; text-align:center;}
  #mid{color:#cbd2dc; font-size:12.5px; margin-top:4px;}
  #mclose{position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:16px; width:36px; height:36px;
    border-radius:50%; border:none; background:rgba(255,255,255,.16); color:#fff; font-size:18px; cursor:pointer;}
</style>
</head>

const $=id=>document.getElementById(id);
const grid=$("grid"), q=$("q"), count=$("count"), empty=$("empty"), more=$("more"), clearBtn=$("clear");
const PAGE=60;
let filtered=DATA, shown=0;

// ひらがな→カタカナ、全角英数→半角、小文字化、空白除去
function norm(s){
  return String(s).toLowerCase()
    .replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s　]+/g,"");
}
const NORMS=DATA.map(d=>norm(d[1]));

function url(d){return P[d[2]]+d[3];}

function render(reset){
  if(reset){grid.innerHTML=""; shown=0;}
  const frag=document.createDocumentFragment();
  const end=Math.min(shown+PAGE,filtered.length);
  for(let i=shown;i<end;i++){
    const d=filtered[i];
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML='<div class="imgwrap"><img loading="lazy" decoding="async" src="'+url(d)+'" alt=""></div>'
      +'<div class="meta"><div class="name"></div><div class="id">ID: '+d[0]+'</div></div>';
    el.querySelector(".name").textContent=d[1];
    el.addEventListener("click",()=>openModal(d));
    frag.appendChild(el);
  }
  grid.appendChild(frag);
  shown=end;
  more.style.display=shown<filtered.length?"block":"none";
  empty.style.display=filtered.length?"none":"block";
  count.textContent=filtered.length+"件"+(q.value?"がヒット":"");
}

function search(){
  const kw=q.value.trim();
  clearBtn.style.display=kw?"block":"none";
  if(!kw){filtered=DATA; render(true); return;}
  const nk=norm(kw);
  const isNum=/^[0-9]+$/.test(nk);
  filtered=DATA.filter((d,i)=>{
    if(isNum && String(d[0]).includes(nk)) return true;
    return NORMS[i].includes(nk);
  });
  render(true);
}

let timer;
q.addEventListener("input",()=>{clearTimeout(timer); timer=setTimeout(search,120);});
clearBtn.addEventListener("click",()=>{q.value=""; search(); q.focus();});
more.addEventListener("click",()=>render(false));

// modal
const modal=$("modal");
function openModal(d){
  $("mimg").src=url(d);
  $("mname").textContent=d[1];
  $("mid").textContent="ID: "+d[0];
  modal.classList.add("open");
}
modal.addEventListener("click",e=>{if(e.target.id!=="mimg")modal.classList.remove("open");});
$("mclose").addEventListener("click",()=>modal.classList.remove("open"));

$("total").textContent="全"+DATA.length+"件";
render(true);
</script>
